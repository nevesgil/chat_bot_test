services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: database
    ports:
      - "5432:5432"
    volumes:
      - ./database/database/postgres_data:/var/lib/postgresql/data
      - ./database/scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - my_network

  api:
    build: ./backend
    container_name: backend
    depends_on:
      - postgres
    ports:
      - "8001:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://admin:admin@postgres:5432/database
    networks:
      - my_network
    volumes:
      - ./backend:/app
  mcpserver:
    build: ./mcpserver
    container_name: mcpserver
    ports:
      - "8002:8000"
    networks:
      - my_network
    volumes:
      - ./mcpserver:/app

  langflow:
    image: langflowai/langflow:latest
    container_name: langflow
    ports:
      - "7860:7860"
    depends_on:
      - ollama
    environment:
      LANGFLOW_SUPERUSER: admin
      LANGFLOW_SUPERUSER_PASSWORD: admin123
    networks:
      - my_network

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ./ollama:/root/.ollama
    networks:
      - my_network
    gpus: all

volumes:
  postgres_data:

networks:
  my_network:
    driver: bridge